<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinkit Mini</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body {font-family:sans-serif;background:#f4f4f4;}
.navbar-brand{color:#ff6b35;font-weight:bold;}
.card:hover{transform:scale(1.05);}
.product-img{height:120px;object-fit:cover;}
.btn-primary{background:#ff6b35;border:none;}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar bg-white shadow-sm">
<div class="container">
<a class="navbar-brand"><i class="fas fa-bolt"></i> Blinkit</a>
<i class="fas fa-shopping-cart"></i>
</div>
</nav>

<!-- Search -->
<div class="container my-4">
<input class="form-control" placeholder="Search groceries...">
</div>

<!-- Categories -->
<div class="container mb-4">
<h5>Categories</h5>
<div class="row text-center">
<div class="col">🍎 Fruits</div>
<div class="col">🥬 Veggies</div>
<div class="col">🍞 Bread</div>
<div class="col">🥚 Eggs</div>
</div>
</div>

<!-- Products -->
<div class="container">
<h5>Products</h5>
<div class="row g-3">

<div class="col-6 col-md-3">
<div class="card p-2">
<img src="https://via.placeholder.com/150" class="product-img">
<h6>Milk</h6>
<p>₹55</p>
<button class="btn btn-primary btn-sm">Add</button>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card p-2">
<img src="https://via.placeholder.com/150" class="product-img">
<h6>Bread</h6>
<p>₹45</p>
<button class="btn btn-primary btn-sm">Add</button>
</div>
</div>

</div>
</div>

</body>
</html>
